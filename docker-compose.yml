services:
  server:
    build: ./TR_SERVER
    container_name: travel-server
    ports:
      - "3300:3300"
    volumes:
      # 挂载 .env 配置文件
      - ./TR_SERVER/.env:/app/.env:ro
      # 挂载数据库目录，确保数据持久化
      - ./data:/app/src/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    ports:
      - "80:80"
    volumes:
      # 挂载前端构建产物
      - ./TR_H5/dist:/usr/share/nginx/html:ro
      # 挂载 Nginx 配置
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped
